spring.application.name=HotelReservationSystem

spring.datasource.url=jdbc:mysql://localhost:3306/hotel_reservation?useSSL=false
spring.datasource.username=root
spring.datasource.password=121314

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

info.app.name=Hotel Reservation Management
info.app.description=Hotel booking and reservation REST API
info.app.version=1.0.0

spring.datasource.hikari.pool-name=HotelHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
